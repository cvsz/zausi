name: "AUSI IaC Validation & Dry-Run Pipeline"

on:
  push:
    branches:
      - main
      - release/*
    paths:
      - "terraform/**"
      - "helm/**"
      - ".github/workflows/iac-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"
      - "helm/**"
      - ".github/workflows/iac-ci.yml"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  helm-lint-and-dry-run:
    name: "Helm Lint & Dry-Run"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Lint Helm Chart
        run: |
          echo "==> Linting ausi-platform Helm chart..."
          helm lint helm/ausi-platform

      - name: Template & Dry-Run Rendering
        run: |
          echo "==> Rendering Helm templates with default values..."
          helm template ausi-platform helm/ausi-platform \
            --values helm/ausi-platform/values.yaml \
            --namespace ausi-core > rendered-output.yaml

          echo "==> Rendered manifest summary:"
          grep -E "kind:|name:" rendered-output.yaml | head -n 30

      - name: Upload Rendered Manifests
        uses: actions/upload-artifact@v7
        with:
          name: rendered-helm-manifests
          path: rendered-output.yaml

  terraform-validate-and-plan:
    name: "Terraform Validate & Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init (Mock Backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Setup Helm for Terraform Provider
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Create Mock Kubeconfig for Dry Run
        run: |
          mkdir -p ~/.kube
          cat <<EOF > ~/.kube/config
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://127.0.0.1:6443
            name: mock-cluster
          contexts:
          - context:
              cluster: mock-cluster
              user: mock-user
            name: mock-context
          current-context: mock-context
          users:
          - name: mock-user
            user:
              token: mock-token
          EOF

      - name: Terraform Plan (Dry-Run)
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="kubeconfig_path=$HOME/.kube/config"
        continue-on-error: true

      - name: Comment PR with Terraform Plan Status
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const outcome = process.env.PLAN_OUTCOME || "unknown";
            const body = [
              "#### Terraform Validate / Plan \\`" + outcome + "\\`",
              "",
              "Plan ran against a mock kubeconfig; live diffs require the",
              "self-hosted runner with cluster credentials.",
              "*Pushed by: @" + context.actor + ", event: `" + context.eventName + "`*"
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
